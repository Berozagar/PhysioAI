[pytest]
# Collection is confined to tests/ on purpose. The root-level test_*.py files
# are manual demo scripts, not pytest tests -- test_drawing.py opens a GUI
# window and blocks on waitKey(0), and test_pose_detector.py needs a webcam,
# so collecting them would hang an automated run.
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers
